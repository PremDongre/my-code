{% extends "panel.html" %}{% block body %}<div class="ph"><h1>Settings</h1><p>Manage your password and preferences</p></div>
<div class="card"><h3>Change Password</h3><form method="post"><input type="hidden" name="action" value="password">
<label>Current password</label><input type="password" name="old" required><label>New password</label><input type="password" name="new" required>
<label>Confirm new password</label><input type="password" name="confirm" required><button class="btn" style="margin-top:16px">Change password</button></form></div>
{% if me.role=='student' %}<div class="card"><h3>Email updates</h3><form method="post">
<label><input type="checkbox" name="email_updates" {{ 'checked' if me.email_updates }}>Send me email updates about my applications</label>
<button class="btn" style="margin-top:12px">Save</button></form></div>{% endif %}{% endblock %}
