# Connect - WEB TIER (Nginx). Goes to /etc/nginx/nginx.conf on the web-tier EC2.
# APP_ALB_DNS is replaced automatically by setup-web-tier.sh with your internal load balancer address.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr xff=$http_x_forwarded_for [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 6m;              # resume / certificate uploads (app allows 5 MB)
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # VPC DNS - lets Nginx re-resolve the internal load balancer when its IPs change
    resolver 169.254.169.253 valid=20s ipv6=off;

    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80 default_server;
        server_name _;

        # health check for the PUBLIC load balancer
        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

        # CSS / JS / logo are served straight from this web server (fast); if a file is missing, ask the app tier
        location /static/ {
            root /var/www/connect;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri @app;
        }

        location @app {
            set $app_tier "http://APP_ALB_DNS";
            proxy_pass $app_tier;
            include /etc/nginx/connect-proxy.conf;
        }

        # everything else -> APP TIER (through the internal load balancer)
        location / {
            set $app_tier "http://APP_ALB_DNS";
            proxy_pass $app_tier;
            include /etc/nginx/connect-proxy.conf;
        }
    }
}
